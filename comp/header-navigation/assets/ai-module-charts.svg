<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="cardShadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad4)"/>

  <g transform="translate(30, 24)">
    <rect width="1140" height="632" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow4)"/>

    <!-- Top Chrome -->
    <rect width="1140" height="52" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect y="32" width="1140" height="20" fill="#F8FAFC"/>
    <line x1="0" y1="52" x2="1140" y2="52" stroke="#E2E8F0" stroke-width="1"/>

    <circle cx="28" cy="26" r="6" fill="#EF4444"/>
    <circle cx="48" cy="26" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="26" r="6" fill="#10B981"/>

    <g transform="translate(100, 16)">
      <rect width="180" height="22" rx="11" fill="#E7F6EC"/>
      <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#15803D" letter-spacing="0.5">📊 AI CHARTS &amp; ANALYTICS</text>
      <text x="195" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">/ natural-language-bi / revenue-insights</text>
    </g>

    <g transform="translate(970, 15)">
      <rect width="140" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="14" cy="12" r="4" fill="#15803D"/>
      <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.5">ENGINE REAL-TIME</text>
    </g>

    <!-- Content Stage -->
    <!-- NL Query Prompt Input Bar -->
    <g transform="translate(24, 72)">
      <rect width="1092" height="60" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
      <circle cx="34" cy="30" r="15" fill="#DCFCE7"/>
      <text x="25" y="36" font-size="16">✨</text>
      <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#15803D" letter-spacing="0.5">NATURAL LANGUAGE SALES QUERY</text>
      <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0F172A" font-style="italic">"Show me conversion rates by channel and revenue won this month"</text>
      
      <rect x="940" y="16" width="130" height="28" rx="14" fill="#15803D"/>
      <text x="956" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">QUERY EXECUTED</text>
    </g>

    <!-- KPI Metrics Strip -->
    <g transform="translate(24, 148)">
      <g transform="translate(0, 0)">
        <rect width="345" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">TOTAL WON REVENUE</text>
        <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0F172A">RM 445,000</text>
        <rect x="230" y="42" width="96" height="24" rx="12" fill="#DCFCE7"/>
        <text x="242" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#15803D">▲ +28.4% MoM</text>
      </g>

      <g transform="translate(372, 0)">
        <rect width="345" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">AVERAGE DEAL VELOCITY</text>
        <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0F172A">4.2 Days</text>
        <rect x="230" y="42" width="96" height="24" rx="12" fill="#DBEAFE"/>
        <text x="242" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#2563EB">⚡ 1.8x Faster</text>
      </g>

      <g transform="translate(744, 0)">
        <rect width="348" height="96" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">INBOUND QUALIFIED RATE</text>
        <text x="18" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#0F172A">68.2%</text>
        <rect x="230" y="42" width="96" height="24" rx="12" fill="#DCFCE7"/>
        <text x="242" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#15803D">▲ +14% YoY</text>
      </g>
    </g>

    <!-- Visual Channel Breakdown Chart -->
    <g transform="translate(24, 260)">
      <rect width="1092" height="170" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Channel Conversion Rate vs Won Revenue</text>
      
      <!-- Bar 1: WhatsApp -->
      <g transform="translate(20, 46)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0F172A">💬 Official WhatsApp API</text>
        <text x="960" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#15803D">RM 245,000 (42.8%)</text>
        <rect y="20" width="1052" height="14" rx="7" fill="#E2E8F0"/>
        <rect y="20" width="880" height="14" rx="7" fill="#15803D"/>
      </g>

      <!-- Bar 2: Web Forms -->
      <g transform="translate(20, 88)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0F172A">📋 Website Web Forms</text>
        <text x="960" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563EB">RM 120,000 (28.4%)</text>
        <rect y="20" width="1052" height="14" rx="7" fill="#E2E8F0"/>
        <rect y="20" width="580" height="14" rx="7" fill="#2563EB"/>
      </g>

      <!-- Bar 3: Social & Ads -->
      <g transform="translate(20, 130)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0F172A">📱 Social &amp; Ads (FB/IG)</text>
        <text x="960" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B">RM 80,000 (19.2%)</text>
        <rect y="20" width="1052" height="14" rx="7" fill="#E2E8F0"/>
        <rect y="20" width="400" height="14" rx="7" fill="#94A3B8"/>
      </g>
