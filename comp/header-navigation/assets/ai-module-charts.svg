    <!-- Bottom AI Executive Insight Callout -->
    <g transform="translate(24, 444)">
      <rect width="1092" height="58" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
      <circle cx="30" cy="29" r="14" fill="#DCFCE7"/>
      <text x="22" y="34" font-size="14">💡</text>
      <text x="56" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">AI Executive Takeaway:</text>
      <text x="195" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">Inbound leads responded to within 60 seconds on WhatsApp closed at a <tspan font-weight="700" fill="#15803D">2.2x higher rate</tspan> than other channels.</text>
      <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Recommendation: Expand WhatsApp ad budget allocation by 20% for Q3.</text>
    </g>
