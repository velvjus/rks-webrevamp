<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Capabilities – Smart scheduling</title>

<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');</script>
<style>.embed, .embed body { overflow: hidden !important; } .embed body { padding: 0 !important; background: transparent !important; min-height: 0 !important; display: block !important; } .embed .rkac-sched { border-radius: 0; }</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Embed: everything below is scoped to .rkac-sched ---------- */
  .rkac-sched {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 677 / 383;
    overflow: hidden;
    border-radius: 16px;
    background: #03130a;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .rkac-sched * { box-sizing: border-box; margin: 0; }
  .rkac-sched img { display: block; max-width: none; }
  .rkac-stage { position: absolute; left: 0; top: 0; width: 677px; height: 383px; transform-origin: 0 0; transform: scale(var(--s, 1)); overflow: hidden; }
  .rkac-abs { position: absolute; }
  .rkac-abs > img { width: 100%; height: 100%; }
  .rkac-ui { position: absolute; inset: 0; transition: opacity 260ms var(--ease-out); }
  .rkac-sched.is-out .rkac-ui { opacity: 0; }
  .rkac-sched.is-snap *, .rkac-sched.is-snap *::before, .rkac-sched.is-snap *::after { transition: none !important; animation: none !important; }

  /* ---------- Chat window ---------- */
  .rkac-window { left: 57px; top: 85px; width: 363px; height: 365px; border-radius: 13px; background: rgba(255,255,255,0.12);
    box-shadow: 0 46px 19px rgba(0,0,0,0.01), 0 26px 16px rgba(0,0,0,0.05), 0 12px 12px rgba(0,0,0,0.09), 0 3px 6px rgba(0,0,0,0.1); }
  .rkac-pane { position: absolute; left: 9px; top: 11px; width: 346px; height: 343px; border-radius: 8px 8px 0 0; overflow: hidden; background: #f3f3f3; }
  .rkac-pane > img { width: 346px; height: 53.5px; }
  .rkac-customer { left: 83px; top: 158px; width: 284px; height: 79px; padding: 10px 11px; border-radius: 10px 10px 10px 0; background: #fff; }
  .rkac-customer p:first-child { font-weight: 500; font-size: 13px; line-height: 16px; color: #000; }
  .rkac-customer p:last-child { position: absolute; left: 11px; top: 56px; font-size: 11px; color: #737b89; }
  .rkac-ai { left: 190px; top: 255px; width: 240px; height: 96px; border-radius: 11px 11px 0 11px; background: #22b751; color: #fff;
    box-shadow: 57px 101px 46px rgba(104,110,105,0.01), 32px 57px 39px rgba(104,110,105,0.05), 14px 25px 29px rgba(104,110,105,0.09), 4px 6px 16px rgba(104,110,105,0.1); }
  .rkac-ai img { position: absolute; left: 15px; top: 12px; width: 15px; height: 15px; }
  .rkac-ai span { position: absolute; white-space: nowrap; line-height: normal; }
  .rkac-aiLabel { left: 40px; top: 11px; font-weight: 600; font-size: 12px; color: #4aff83; }
  .rkac-aiText { left: 15px; top: 35px; font-weight: 500; font-size: 15.5px; }
  .rkac-aiTime { left: 134px; top: 69px; font-size: 12px; color: rgba(255,255,255,0.8); }

  /* ---------- Rakan AI ---------- */
  .rkac-robot { left: 377px; top: 220px; width: 67px; height: 67px; border-radius: 50%; background: #fff; border: 3px solid #d1dbd4; filter: drop-shadow(-2px 8px 4px rgba(69,146,88,0.09)) drop-shadow(-1px 2px 2.5px rgba(69,146,88,0.1)); }
  .rkac-face { position: absolute; left: 3.5px; top: 4.5px; width: 54px; height: 54px; border-radius: 50%; overflow: hidden; }
  .rkac-face img { position: absolute; left: -3.5px; top: 3px; width: 61px; height: 60px; transform: scaleX(-1); }
  .rkac-online { position: absolute; left: 45px; top: 45px; width: 17px; height: 17px; border-radius: 50%; background: #23b750; border: 3px solid #fff; }
  .rkac-robot.think .rkac-face img { animation: rkac-think 620ms ease-in-out 2; }
  @keyframes rkac-think { 50% { translate: 0 -3px; rotate: -5deg; } }

  /* ---------- Calendar event ---------- */
  .rkac-event { left: 445px; top: 122px; width: 248px; height: 77px; border-radius: 10px; overflow: hidden; background: #fff; }
  .rkac-event::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: #2e93e8; }
  .rkac-event img { position: absolute; left: 21px; top: 18px; width: 13px; height: 13px; }
  .rkac-event b { position: absolute; left: 42px; top: 17px; font-weight: 600; font-size: 13px; color: #0b240e; white-space: nowrap; }
  .rkac-event small { position: absolute; left: 42px; top: 48px; font-weight: 500; font-size: 10px; color: #686868; white-space: nowrap; }
  .rkac-event::after { content: ""; position: absolute; left: 165px; right: 0; top: 0; bottom: 0; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 62%); mask-image: linear-gradient(90deg, transparent, #000 62%); }

  /* ---------- Calendar tiles ---------- */
  .rkac-glass { border-radius: 20px; }
  .rkac-tileGlow { transform: rotate(var(--r)); }

  /* ---------- Added to Calendar ---------- */
  .rkac-badge { left: 486px; top: 68px; width: 159px; height: 27px; border-radius: 0 15px 15px 0; background: rgba(255,255,255,0.1); overflow: hidden; }
  .rkac-badge::before { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid rgba(177,253,126,0.75); -webkit-mask-image: linear-gradient(90deg, transparent 8%, #000 34%); mask-image: linear-gradient(90deg, transparent 8%, #000 34%); }
  .rkac-badge span { position: absolute; left: 29px; top: 6px; font-weight: 600; font-size: 13px; color: #b1fd7e; white-space: nowrap; line-height: 14px; }

  /* ---------- Connector ---------- */
  .rkac-link { left: 431px; top: 223px; width: 115.5px; height: 83.5px; overflow: visible; }
  .rkac-link .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .rkac-link.on .draw { stroke-dashoffset: 0; transition: stroke-dashoffset 760ms var(--ease-in-out); }
  .rkac-head { position: absolute; left: 0; top: 0; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #d7ffc0; box-shadow: 0 0 8px 3px #74ff1a; opacity: 0;
    offset-path: path("M0 82H89Q114 82 114 57V0"); offset-distance: 0%; offset-rotate: 0deg; }

  /* ---------- Sequence states ---------- */
  .rkac-in { opacity: 0; transition: opacity 420ms var(--ease-out), transform 640ms var(--ease-out); }
  .rkac-in.on { opacity: 1; transform: none; }
  .rkac-fromL { transform: translate(-16px, 10px); }
  .rkac-grow { transform: translateY(14px) scale(0.86); transform-origin: 100% 100%; }
  .rkac-fromR { transform: translateX(70px); transition-timing-function: var(--ease-out), var(--ease-back); }
  .rkac-pop { opacity: 0; scale: 0.3; transition: opacity 280ms var(--ease-out), scale 540ms var(--ease-back); }
  .rkac-pop.on { opacity: 1; scale: 1; }
  .rkac-wipe { clip-path: inset(0 100% 0 0); transition: clip-path 620ms var(--ease-in-out); }
  .rkac-wipe.on { clip-path: inset(0 0 0 0); }
  .rkac-ripple { position: absolute; left: 365px; top: 157px; width: 152px; height: 152px; border-radius: 50%; border: 0.6px solid #7cf2a0; opacity: 0; pointer-events: none; }

  /* ---------- Idle ---------- */
  .rkac-sched.is-idle .rkac-floatA { animation: rkac-float 3.8s ease-in-out infinite alternate; }
  .rkac-sched.is-idle .rkac-floatB { animation: rkac-float 3.2s ease-in-out -1.6s infinite alternate; }
  @keyframes rkac-float { from { translate: 0 -3px; } to { translate: 0 3px; } }
  .rkac-sched.is-idle .rkac-pulse { animation: rkac-pulse 2.8s ease-in-out infinite; }
  @keyframes rkac-pulse { 0%, 60%, 100% { transform: scale(1); } 30% { transform: scale(1.09); } }

  @media (prefers-reduced-motion: reduce) {
    .rkac-sched *, .rkac-sched *::before, .rkac-sched *::after { animation: none !important; transition-property: opacity !important; }
  }
</style>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#1a1d21;padding:16px;box-sizing:border-box">

<!-- ===== Section 4 · 4.1 Smart scheduling ===== -->
<div class="rkac-sched" data-rkac-sched role="img" aria-label="A customer asks for a call on Wednesday at 3pm, Rakan AI replies, and the meeting is added to Google Calendar and Outlook">
  <div class="rkac-stage">
    <div class="rkac-abs" style="left:.54px;top:0;width:675.9px;height:383px"><img src="assets/bg.svg" alt=""></div>
    <div class="rkac-abs" style="left:16px;top:30px;width:443px;height:267px"><img src="assets/glow1.svg" alt=""></div>
    <div class="rkac-abs" style="left:249px;top:215px;width:383px;height:367px"><img src="assets/glow2.svg" alt=""></div>
    <div class="rkac-abs" style="left:365.31px;top:157.31px;width:152.04px;height:152.04px"><img src="assets/ring1.svg" alt=""></div>
    <div class="rkac-abs" style="left:277.04px;top:69.04px;width:328.6px;height:328.6px"><img src="assets/ring2.svg" alt=""></div>
    <div class="rkac-abs" style="left:190.04px;top:-17.96px;width:502.6px;height:502.6px"><img src="assets/ring3.svg" alt=""></div>
    <div class="rkac-abs" style="left:107.2px;top:-100.8px;width:668.3px;height:668.3px"><img src="assets/ring4.svg" alt=""></div>
    <div class="rkac-ripple" data-ripple></div>

    <div class="rkac-ui">
      <div class="rkac-abs rkac-window">
        <div class="rkac-pane"><img src="assets/header.png" alt=""></div>
      </div>
      <div class="rkac-abs rkac-customer rkac-in rkac-fromL" data-customer>
        <p data-f="customerMsg"></p>
        <p data-f="customerTime"></p>
      </div>

      <div class="rkac-abs rkac-ai rkac-in rkac-grow" data-ai>
        <img src="assets/ai-icon.svg" alt="">
        <span class="rkac-aiLabel" data-f="aiLabel"></span>
        <span class="rkac-aiText" data-f="aiReply"></span>
        <span class="rkac-aiTime" data-f="aiTime"></span>
      </div>

      <div class="rkac-abs rkac-robot rkac-pop" data-robot>
        <div class="rkac-face"><img src="assets/robot.png" alt=""></div>
        <div class="rkac-online"></div>
      </div>

      <div class="rkac-abs rkac-event rkac-in rkac-fromR" data-event>
        <img src="assets/event-dot.svg" alt="">
        <b data-f="eventTitle"></b>
        <small data-f="eventTime"></small>
      </div>

      <!-- Google Calendar -->
      <div class="rkac-abs rkac-pop" data-gcal style="left:532px;top:147px;width:141px;height:143px">
        <div class="rkac-abs rkac-floatA" style="inset:0">
          <div class="rkac-abs rkac-tileGlow" style="--r:-157.14deg;inset:0"><img src="assets/tile-glow.svg" alt=""></div>
          <div class="rkac-abs rkac-glass" style="left:39.28px;top:37.35px;width:62.75px;height:65.42px;background:linear-gradient(132.3deg, rgba(255,255,255,0) 0.14%, rgba(223,223,223,0.75) 99.86%)"></div>
          <div class="rkac-abs" style="left:42.49px;top:43.88px;width:55.74px;height:55.65px"><img src="assets/gcal.png" alt="" style="transform:rotate(.91deg)"></div>
        </div>
      </div>

      <!-- Outlook -->
      <div class="rkac-abs rkac-pop" data-outlook style="left:575px;top:215px;width:157px;height:160px">
        <div class="rkac-abs rkac-floatB" style="inset:0">
          <div class="rkac-abs rkac-tileGlow" style="--r:22.29deg;inset:0"><img src="assets/tile-glow2.svg" alt=""></div>
          <div class="rkac-abs rkac-glass" style="left:40.96px;top:42.53px;width:75.27px;height:78.43px;background:linear-gradient(311.7deg, rgba(255,255,255,0) 0.14%, rgba(223,223,223,0.75) 99.86%)"></div>
          <div class="rkac-abs" style="left:48.67px;top:57.4px;width:58.4px;height:53.73px"><img src="assets/outlook.png" alt="" style="transform:rotate(-.38deg)"></div>
        </div>
      </div>

      <!-- Connector from the AI reply to the calendar -->
      <div class="rkac-abs rkac-link" data-link>
        <svg width="115.5" height="83.5" viewBox="0 0 115.5 83.5" fill="none" style="display:block;overflow:visible">
          <mask id="rkac-draw" maskUnits="userSpaceOnUse" x="-6" y="-6" width="128" height="96">
            <path class="draw" pathLength="1" d="M0 82H89Q114 82 114 57V0" stroke="#fff" stroke-width="6"/>
          </mask>
          <path mask="url(#rkac-draw)" d="M0 82H3.17857M114 0V2.84999M9.53571 82H15.8929M22.25 82H28.6071M34.9643 82H41.3214M47.6786 82H54.0357M60.3929 82H66.75M73.1071 82H79.4643M85.8214 82H89C90.1067 82 91.1966 81.9281 92.2652 81.7887M98.5697 80.103C100.602 79.2602 102.499 78.157 104.22 76.835M108.835 72.2196C110.157 70.4993 111.26 68.6021 112.103 66.5697M113.789 60.2652C113.928 59.1966 114 58.1067 114 57V54.15M114 48.45V42.75M114 37.05V31.35M114 25.65V19.95M114 14.25V8.54999" stroke-width="3" stroke="#74FF1A"/>
        </svg>
        <div class="rkac-head" data-head></div>
      </div>
      <div class="rkac-abs rkac-pop" data-node-a style="left:424px;top:299px;width:12px;height:12px"><img src="assets/node.svg" alt=""></div>
      <div class="rkac-abs rkac-pop" data-node-b style="left:539px;top:205px;width:12px;height:12px"><img src="assets/node.svg" alt=""></div>

      <!-- Added to Calendar -->
      <div class="rkac-abs rkac-badge rkac-wipe" data-badge><span data-f="badge"></span></div>
      <div class="rkac-abs rkac-pop" data-appt style="left:425.07px;top:22.07px;width:117.3px;height:117.8px"><div class="rkac-abs rkac-pulse" style="inset:0"><img src="assets/appointment.svg" alt="" style="width:100%;height:100%"></div></div>
    </div>
  </div>
</div>

<script>
(() => {
  const root = document.querySelector('[data-rkac-sched]');
  if (!root) return;
  const stage = root.querySelector('.rkac-stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const DESIGN_W = 677;
  new ResizeObserver(([e]) => stage.style.setProperty('--s', e.contentRect.width / DESIGN_W)).observe(root);

  // ---------- Editable content ----------
  const copy = {
    customerMsg: 'Hi, can we schedule a call discussion this Wed? Around 3pm',
    customerTime: 'Oct 7, 10:30 AM',
    aiLabel: 'Sent by AI',
    aiReply: 'Hello! Okay sure.',
    aiTime: 'Oct 7, 10:30 AM',
    eventTitle: 'Client Discussion Meeting',
    eventTime: '3.00 - 3.30pm',
    badge: 'Added to Calendar',
  };
  root.querySelectorAll('[data-f]').forEach((el) => { el.textContent = copy[el.dataset.f]; });

  const $ = (s) => root.querySelector(s);
  const on = (s) => () => $(s).classList.add('on');
  let timers = [], anims = [], playing = false, played = false;
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const fx = (el, frames, opts) => { const a = el.animate(frames, { fill: 'both', ...opts }); anims.push(a); return a; };

  // One ring per event, rippling out from behind the scene
  const ripple = () => fx($('[data-ripple]'), [{ opacity: 0.9, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(4.6)' }], { duration: 1100, easing: 'cubic-bezier(0.23,1,0.32,1)' });
  const runHead = () => fx($('[data-head]'), [{ offsetDistance: '0%', opacity: 1 }, { offsetDistance: '100%', opacity: 1, offset: 0.97 }, { offsetDistance: '100%', opacity: 0 }], { duration: 760, easing: 'cubic-bezier(0.77,0,0.175,1)' });

  // ---------- The sequence: [time ms, state change, motion-only effect] ----------
  const steps = [
    [150,  on('[data-customer]')],
    [1000, on('[data-robot]')],
    [1250, null, () => $('[data-robot]').classList.add('think')],
    [2150, on('[data-ai]')],
    [2850, on('[data-node-a]')],
    [3000, on('[data-link]'), runHead],
    [3720, on('[data-node-b]')],
    [3760, on('[data-event]'), ripple],
    [4100, on('[data-gcal]')],
    [4320, on('[data-outlook]')],
    [4720, on('[data-appt]')],
    [4900, on('[data-badge]')],
  ];
  const END = 5700;

  function setStart() { root.querySelectorAll('.on, .think').forEach((el) => el.classList.remove('on', 'think')); }
  function setFinal() { steps.forEach(([, fn]) => fn && fn()); }

  function snap(fn) { root.classList.add('is-snap'); fn(); void root.offsetWidth; root.classList.remove('is-snap'); }
  function clear() { timers.forEach(clearTimeout); timers = []; anims.forEach((a) => a.cancel()); anims = []; }

  function play() {
    playing = true; played = true;
    root.classList.remove('is-idle');
    steps.forEach(([t, fn, effect]) => later(t, () => { fn && fn(); effect && effect(); }));
    later(END, () => { playing = false; root.classList.add('is-idle'); });
  }
  function replay() {
    if (playing || reduce.matches) return;
    playing = true;
    root.classList.add('is-out');
    later(280, () => { clear(); snap(setStart); root.classList.remove('is-out', 'is-idle'); play(); });
  }
  function stop() { clear(); playing = false; played = false; root.classList.remove('is-idle', 'is-out'); snap(setStart); }
  function start() {
    if (played) return;
    if (reduce.matches) { played = true; snap(setFinal); return; }
    play();
  }

  snap(setStart);
  new IntersectionObserver(([e]) => (e.isIntersecting ? start() : stop()), { threshold: 0.35 }).observe(root);
  root.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') replay(); });
  root.addEventListener('click', replay);
})();
</script>
</body>
</html>
